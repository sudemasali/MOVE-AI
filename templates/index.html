<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squat Analiz Uygulaması</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .result-container {
            display: none;
            margin-top: 20px;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .error-message {
            color: red;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Squat Analiz Uygulaması</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="videoFile" class="form-label">Squat Videosu Seçin</label>
                                <input type="file" class="form-control" id="videoFile" name="video" accept=".mp4,.avi,.mov" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Analiz Et</button>
                        </form>
                        
                        <div class="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Yükleniyor...</span>
                            </div>
                            <p class="mt-2">Video analiz ediliyor, lütfen bekleyin...</p>
                        </div>
                        
                        <div class="error-message"></div>
                        
                        <div class="result-container">
                            <h3 class="mb-3">Analiz Sonuçları</h3>
                            <div class="alert" role="alert"></div>
                            
                            <div class="stats mt-4">
                                <p><strong>Toplam Frame Sayısı:</strong> <span id="totalFrames"></span></p>
                                <p><strong>Doğru Frame Sayısı:</strong> <span id="correctFrames"></span></p>
                                <p><strong>Yanlış Frame Sayısı:</strong> <span id="incorrectFrames"></span></p>
                                <p><strong>Doğruluk Yüzdesi:</strong> <span id="correctPercentage"></span>%</p>
                            </div>
                            
                            <div id="errors" class="mt-4">
                                <h4>Tespit Edilen Hatalar</h4>
                                <ul class="list-group"></ul>
                            </div>
                            
                            <div id="suggestions" class="mt-4">
                                <h4>Öneriler</h4>
                                <ul class="list-group"></ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const loading = document.querySelector('.loading');
            const resultContainer = document.querySelector('.result-container');
            const errorMessage = document.querySelector('.error-message');
            
            // UI'ı sıfırla
            loading.style.display = 'block';
            resultContainer.style.display = 'none';
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Sonuçları göster
                    resultContainer.style.display = 'block';
                    
                    // Genel sonuç
                    const alert = resultContainer.querySelector('.alert');
                    if (data.is_correct) {
                        alert.className = 'alert alert-success';
                        alert.textContent = '✅ Squat Doğru!';
                    } else {
                        alert.className = 'alert alert-danger';
                        alert.textContent = '❌ Squat Hatalı!';
                    }
                    
                    // İstatistikler
                    document.getElementById('totalFrames').textContent = data.total_frames;
                    document.getElementById('correctFrames').textContent = data.correct_frames;
                    document.getElementById('incorrectFrames').textContent = data.incorrect_frames;
                    document.getElementById('correctPercentage').textContent = data.correct_percentage.toFixed(1);
                    
                    // Hatalar
                    const errorsList = document.querySelector('#errors .list-group');
                    errorsList.innerHTML = '';
                    data.errors.forEach(error => {
                        const li = document.createElement('li');
                        li.className = 'list-group-item';
                        li.textContent = `${error.type}: ${error.count} frame (${error.percentage.toFixed(1)}%)`;
                        errorsList.appendChild(li);
                    });
                    
                    // Öneriler
                    const suggestionsList = document.querySelector('#suggestions .list-group');
                    suggestionsList.innerHTML = '';
                    data.suggestions.forEach(suggestion => {
                        const li = document.createElement('li');
                        li.className = 'list-group-item';
                        li.textContent = suggestion;
                        suggestionsList.appendChild(li);
                    });
                } else {
                    errorMessage.textContent = data.error || 'Bir hata oluştu';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Bir hata oluştu: ' + error.message;
                errorMessage.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
